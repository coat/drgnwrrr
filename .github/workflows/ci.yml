name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - .gitignore
      - .envrc
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the build of the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.17.1"

      # Named, as zig-pkg holds dependencies that are not ours to format, and
      # tools/romcheck/reference.zig is generated (docs/reference/build.mjs).
      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src tools/romcheck/main.zig tools/romextract tools/atlas tools/fontbake tools/serve

  # Not romcheck: CI's ROM is only the header and bank 0 (tools/ci-rom.sh).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.17.1"

      - name: Rebuild the ROM
        env:
          ROM_BANK0: ${{ secrets.ROM_BANK0 }}
        run: tools/ci-rom.sh

      - name: Run tests
        run: zig build test -Drom="$ROM" --summary all

  build:
    uses: ./.github/workflows/build.yml
    secrets:
      ROM_BANK0: ${{ secrets.ROM_BANK0 }}
